name: Sync family places

on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:places
      - run: npm run import:seeds
      - run: npm run sync:forest
      - run: npm run sync:farm
      - run: npm run sync:culture
      - run: npm run sync:wikimedia-images
      - name: Sync OSM restaurant data
        # Overpass mirrors are external and can intermittently fail. Keep the
        # main daily place sync green by reusing the previous OSM dataset when
        # the fetch fails, matching the standalone OSM workflow behavior.
        run: npm run sync:osm-restaurants || echo "::warning::Overpass fetch failed — keeping previous OSM data"
      - run: npm run import:osm-restaurants
      - run: npm run import:michelin
      - run: npm run data:quality:check
      - run: npm run build

      - name: Commit updated place data
        run: |
          if git diff --quiet -- src/generated public/data docs/data-quality-report.md; then
            echo "No place data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated public/data docs/data-quality-report.md
          git commit -m "data: sync tourism attractions"
          git push
