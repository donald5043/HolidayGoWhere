name: Sync live traffic

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run sync without pushing to live-traffic branch'
        type: boolean
        default: false
  # 同步腳本或本檔變動時跑一次乾跑當驗證(任何分支;不推 live-traffic)
  push:
    paths:
      - scripts/sync-traffic.mjs
      - .github/workflows/sync-traffic.yml
  schedule:
    # 每 10 分鐘更新壅塞路段清單(GitHub cron 實際觸發常有數分鐘延遲)
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-traffic
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch TDX live traffic
        run: node scripts/sync-traffic.mjs
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          TRAFFIC_OUTPUT: ${{ runner.temp }}/traffic.json

      - name: Show summary
        run: |
          node -e "
          const p = require(process.env.RUNNER_TEMP + '/traffic.json')
          console.log('generatedAt:', p.generatedAt)
          console.log('syncStatus:', JSON.stringify(p.syncStatus))
          console.log('congested sections:', p.count)
          for (const s of p.congested.slice(0, 10)) console.log(' ', s.road, s.name, s.dir || '', s.speed + ' km/h', s.lat + ',' + s.lng)
          "

      # 即時資料走獨立分支 + force push:不觸發 Pages 重新部署、預設分支也不會被
      # 每 10 分鐘一筆的 commit 洗版;前端從 raw.githubusercontent.com 讀取
      - name: Push to live-traffic branch
        if: ${{ github.event_name != 'push' && !inputs.dry_run }}
        run: |
          dir="$(mktemp -d)"
          cp "$RUNNER_TEMP/traffic.json" "$dir/"
          cd "$dir"
          git init -b live-traffic -q
          git add traffic.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: live traffic snapshot"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-traffic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
