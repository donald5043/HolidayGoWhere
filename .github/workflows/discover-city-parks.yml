name: Discover city park APIs (temporary research)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/discover-city-parks.mjs
      - .github/workflows/discover-city-parks.yml

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discover-city-parks.mjs
