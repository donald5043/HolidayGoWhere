name: Sync OSM restaurants

on:
  workflow_dispatch:
  schedule:
    # 每天 03:00 UTC (台灣時間 11:00)，錯開 sync-places 的 22:15
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch OSM restaurant data
        # Overpass 偶有服務中斷，失敗時跳過本次但不讓 workflow 變紅燈
        run: npm run sync:osm-restaurants || echo "::warning::Overpass fetch failed — skipping update"

      - name: Commit updated restaurant data
        run: |
          if git diff --quiet -- src/generated/restaurants-osm.json; then
            echo "No OSM restaurant changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/restaurants-osm.json
          git commit -m "data: auto-sync OSM restaurant data [skip ci]"
          git push
